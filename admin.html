<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Painel DAMARCO · orçamentos, obras e entregas</title>
<meta name="theme-color" content="#0d0d0d">
<link rel="icon" href="fotos/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/admin.css?v=20260930050413">
</head>
<body>
<header class="barra">
  <div class="barra-in">
    <a class="marca" href="index.html"><span class="logo">DAMARCO</span><span class="marca-sub">Painel</span></a>
    <span class="selo-demo" id="selo-demo" hidden>Demonstração</span>
    <div class="barra-acoes">
      <a class="btn btn-fino" href="index.html" target="_blank" rel="noopener">Ver site</a>
      <button class="btn btn-fino" id="btn-sair" hidden>Sair</button>
    </div>
  </div>
  <nav class="abas" id="abas" aria-label="Seções do painel">
    <button data-aba="geral" aria-current="page">Visão geral</button>
    <button data-aba="funil">Funil</button>
    <button data-aba="agenda">Agenda</button>
    <button data-aba="entregas">Entregas</button>
    <button data-aba="relatorio">Relatório</button>
    <button data-aba="equipamentos">Equipamentos</button>
  </nav>
</header>

<div class="aviso-demo" id="aviso-demo" hidden>
  <strong>Modo demonstração.</strong> Clientes, locais e valores são de exemplo, marcados "(exemplo)". Não são preços nem obras da DAMARCO.
  Pedidos feitos no site por este navegador aparecem aqui. <button class="btn-link" id="btn-zerar">Recomeçar a demo</button>
</div>

<section class="login" id="login" hidden>
  <form class="login-caixa" id="form-login">
    <span class="logo">DAMARCO</span>
    <h1>Entrar no painel</h1>
    <label class="campo"><span>E-mail</span><input type="email" id="lg-email" autocomplete="username" required></label>
    <label class="campo"><span>Senha</span><input type="password" id="lg-senha" autocomplete="current-password" required></label>
    <p class="erro" id="lg-erro" role="alert"></p>
    <button class="btn btn-laranja" type="submit">Entrar</button>
  </form>
</section>

<main class="conteudo" id="conteudo">
  <section class="aba" id="aba-geral"></section>
  <section class="aba" id="aba-funil" hidden></section>
  <section class="aba" id="aba-agenda" hidden></section>
  <section class="aba" id="aba-entregas" hidden></section>
  <section class="aba" id="aba-relatorio" hidden></section>
  <section class="aba" id="aba-equipamentos" hidden></section>
</main>

<dialog class="gaveta" id="gaveta" aria-labelledby="gv-titulo">
  <div class="gaveta-in" id="gaveta-in"></div>
</dialog>
<dialog class="zoom" id="zoom" aria-label="Foto ampliada">
  <button class="zoom-fechar" id="zoom-fechar" aria-label="Fechar foto">✕</button>
  <img id="zoom-img" alt="">
  <div class="zoom-nav"><button id="zoom-ant" aria-label="Foto anterior">‹</button><span id="zoom-cont"></span><button id="zoom-prox" aria-label="Próxima foto">›</button></div>
</dialog>
<div class="toast" id="toast" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js?v=20260930050413"></script>
<script src="assets/demo.js?v=20260930050413"></script>
<script src="assets/admin.js?v=20260930050413"></script>
</body>
</html>
